<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>15' x 40' House - 3D Walkthrough</title>
<style>
  :root {
    --panel: rgba(20, 24, 30, 0.82);
    --accent: #e8a33d;
    --text: #f3f1ec;
    --muted: #b8b4aa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd8e0;
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, "Nirmala UI", "Kohinoor Devanagari", "Noto Sans Devanagari", sans-serif;
    color: var(--text); -webkit-user-select: none; user-select: none; touch-action: none; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  .labels { position: fixed; inset: 0; pointer-events: none; }
  .room-label { background: rgba(20,24,30,.78); color: #fff; padding: 3px 8px; border-radius: 10px;
    font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid rgba(255,255,255,.25); }

  #topbar { position: fixed; top: 12px; left: 0; right: 0; margin: 0 auto; width: fit-content; max-width: calc(100% - 120px); display: flex; gap: 8px;
    align-items: center; background: var(--panel); padding: 8px 14px; border-radius: 24px; backdrop-filter: blur(6px); }
  #title { font-weight: 700; font-size: 14px; white-space: nowrap; }
  #currentRoom { font-size: 13px; color: var(--accent); white-space: nowrap; }

  #panel { position: fixed; top: 64px; left: 12px; width: 220px; max-height: calc(100% - 150px); overflow-y: auto;
    background: var(--panel); border-radius: 14px; padding: 10px; backdrop-filter: blur(6px); transition: transform .25s; }
  #panel.hidden { transform: translateX(-260px); }
  #panel h3 { margin: 6px 4px 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  #panel button.room { display: block; width: 100%; text-align: left; margin: 3px 0; padding: 8px 10px; border: 0;
    border-radius: 9px; background: rgba(255,255,255,.07); color: var(--text); font-size: 14px; cursor: pointer; }
  #panel button.room:hover { background: rgba(255,255,255,.16); }
  #panel button.room.active { background: var(--accent); color: #1b1b1b; font-weight: 600; }

  #menuToggle { position: fixed; top: 12px; left: 12px; width: 42px; height: 42px; border-radius: 50%; border: 0;
    background: var(--panel); color: var(--text); font-size: 20px; cursor: pointer; }

  #bottombar { position: fixed; bottom: 14px; left: 0; right: 0; margin: 0 auto; width: fit-content; display: flex; flex-wrap: wrap;
    justify-content: center; gap: 6px; background: var(--panel); padding: 8px; border-radius: 24px; backdrop-filter: blur(6px);
    max-width: calc(100% - 20px); }
  #bottombar button { border: 0; border-radius: 18px; padding: 8px 14px; background: rgba(255,255,255,.1); color: var(--text);
    font-size: 13px; cursor: pointer; white-space: nowrap; }
  #bottombar button:hover { background: rgba(255,255,255,.2); }
  #bottombar button.on { background: var(--accent); color: #1b1b1b; font-weight: 600; }
  #bottombar .sep { width: 1px; background: rgba(255,255,255,.2); margin: 2px 2px; }
  #dollButtons { display: none; gap: 6px; }
  body.doll #dollButtons { display: flex; }

  #help { position: fixed; top: 62px; left: 50%; transform: translateX(-50%); pointer-events: none; background: var(--panel); padding: 6px 14px;
    border-radius: 14px; font-size: 12px; color: var(--muted); white-space: nowrap; transition: opacity .6s; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .28s; }
  #loading {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  background: #1d2228; color: var(--text);
  transition: opacity .4s ease-out;
}
#loading.gone { opacity: 0; pointer-events: none; }
.loader-spinner {
  width: 38px; height: 38px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,.15);
  border-top-color: var(--accent);
  animation: loader-spin .8s linear infinite;
}
@keyframes loader-spin { to { transform: rotate(360deg); } }
.loader-text { font-size: 14px; color: var(--muted); letter-spacing: .02em; }

  #joystick { position: fixed; left: 26px; bottom: 96px; width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); display: none; touch-action: none; }
  #joystick .knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%;
    background: rgba(255,255,255,.55); }
  body.touch.walk #joystick { display: block; }

  #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
    background: rgba(255,255,255,.7); box-shadow: 0 0 2px #000; pointer-events: none; display: none; }
  body.walk #crosshair { display: block; }

  @media (max-width: 700px) {
    #title { display: none; }
    #panel { width: 190px; }
    #bottombar button { padding: 7px 10px; font-size: 12px; }
    #help { font-size: 11px; white-space: normal; text-align: center; width: 90%; }
  }
</style>
</head>
<body class="walk">
  <div id="app"></div>
  <div id="loading">
    <div class="loader-spinner" aria-hidden="true"></div>
    <div class="loader-text">Loading 3D house…</div>
  </div>

  <div id="topbar">
    <span id="title"></span>
    <span id="currentRoom"></span>
  </div>

  <button id="menuToggle" aria-label="Rooms">&#9776;</button>
  <div id="panel"></div>

  <div id="bottombar">
    <button id="btnWalk" class="on"></button>
    <button id="btnDoll"></button>
    <div id="dollButtons">
      <span class="sep"></span>
      <button id="btnGround"></button>
      <button id="btnBoth"></button>
      <button id="btnFull" class="on"></button>
    </div>
    <span class="sep"></span>
    <button id="btnTour"></button>
    <button id="btnLang">हिंदी</button>
  </div>

  <div id="help"></div>
  <div id="joystick"><div class="knob"></div></div>
  <div id="crosshair"></div>
  <div id="fade"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
